<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Idris Business Tools | Profit Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f4f6f8;
            color: #222;
        }

        .calculator {
            max-width: 500px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .intro {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #222;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            background: #222;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        #result {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: #f1f1f1;
            border-radius: 10px;
            line-height: 1.8;
        }

        .profit {
            font-size: 22px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="calculator">

        <h1>Profit Calculator</h1>

        <p class="intro">
            Calculate your business profit and profit percentage.
        </p>

        <label for="buyingPrice">Buying Price</label>
        <input type="number" id="buyingPrice" placeholder="Enter buying price">

        <label for="sellingPrice">Selling Price</label>
        <input type="number" id="sellingPrice" placeholder="Enter selling price">

        <label for="quantity">Quantity</label>
        <input type="number" id="quantity" placeholder="Enter quantity">

        <button onclick="calculateProfit()">Calculate Profit</button>

        <div id="result"></div>

    </div>

    <script>

        function calculateProfit() {

            let buyingPrice = Number(document.getElementById("buyingPrice").value);
            let sellingPrice = Number(document.getElementById("sellingPrice").value);
            let quantity = Number(document.getElementById("quantity").value);

            if (buyingPrice <= 0 || sellingPrice <= 0 || quantity <= 0) {
                document.getElementById("result").style.display = "block";

                document.getElementById("result").innerHTML =
                    "<strong>Please enter valid numbers.</strong>";

                return;
            }

            let totalCost = buyingPrice * quantity;
            let totalSales = sellingPrice * quantity;
            let profit = totalSales - totalCost;

            let profitPercentage = (profit / totalCost) * 100;

            document.getElementById("result").style.display = "block";

            document.getElementById("result").innerHTML =
                "<strong>Total Cost:</strong> ₦" +
                totalCost.toLocaleString() +

                "<br><strong>Total Sales:</strong> ₦" +
                totalSales.toLocaleString() +

                "<br><strong>Profit:</strong> ₦" +
                profit.toLocaleString() +

                "<br><strong>Profit Percentage:</strong> " +
                profitPercentage.toFixed(2) + "%";
        }

    </script>

</body>

</html>
