<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Idris Business Tools</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f4f6f8;
            color: #222;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            margin-bottom: 8px;
        }

        header p {
            color: #666;
        }

        .tool {
            max-width: 500px;
            margin: 25px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
        }

        h2 {
            text-align: center;
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            background: #222;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        .result {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: #f1f1f1;
            border-radius: 10px;
            line-height: 1.8;
        }

        .invoice {
            background: white;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #ddd;
        }

        .invoice h3 {
            text-align: center;
            margin-top: 0;
        }

        .invoice-info {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 15px;
        }

        .total {
            font-size: 22px;
            font-weight: bold;
            margin-top: 15px;
        }

        .print-button {
            background: #0b7a3b;
        }

        .print-button:hover {
            background: #095f2f;
        }

        .price-list {
            background: white;
            padding: 25px;
            border-radius: 10px;
            border: 1px solid #ddd;
        }

        .price-list h3 {
            text-align: center;
            margin-top: 0;
        }

        .price-item {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            padding: 12px 0;
            border-bottom: 1px solid #ddd;
        }

        .price-item:last-child {
            border-bottom: none;
        }

        .price {
            font-weight: bold;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            color: #777;
        }

    </style>

</head>

<body>


    <header>

        <h1>Idris Business Tools</h1>

        <p>
            Simple tools to help small businesses.
        </p>

    </header>


    <!-- PROFIT CALCULATOR -->

    <div class="tool">

        <h2>🧮 Profit Calculator</h2>

        <label>Buying Price</label>

        <input
            type="number"
            id="buyingPrice"
            placeholder="Enter buying price"
        >

        <label>Selling Price</label>

        <input
            type="number"
            id="sellingPrice"
            placeholder="Enter selling price"
        >

        <label>Quantity</label>

        <input
            type="number"
            id="quantity"
            placeholder="Enter quantity"
        >

        <button onclick="calculateProfit()">
            Calculate Profit
        </button>

        <div id="profitResult" class="result"></div>

    </div>


    <!-- DISCOUNT CALCULATOR -->

    <div class="tool">

        <h2>🏷️ Discount Calculator</h2>

        <label>Original Price</label>

        <input
            type="number"
            id="originalPrice"
            placeholder="Enter original price"
        >

        <label>Discount Percentage</label>

        <input
            type="number"
            id="discountPercent"
            placeholder="Example: 20"
        >

        <button onclick="calculateDiscount()">
            Calculate Discount
        </button>

        <div id="discountResult" class="result"></div>

    </div>


    <!-- INVOICE GENERATOR -->

    <div class="tool">

        <h2>🧾 Invoice Generator</h2>

        <label>Business Name</label>

        <input
            type="text"
            id="businessName"
            placeholder="Example: Idris Web Services"
        >

        <label>Customer Name</label>

        <input
            type="text"
            id="customerName"
            placeholder="Enter customer name"
        >

        <label>Item or Service</label>

        <input
            type="text"
            id="itemName"
            placeholder="Example: Website Design"
        >

        <label>Quantity</label>

        <input
            type="number"
            id="invoiceQuantity"
            placeholder="Enter quantity"
        >

        <label>Price</label>

        <input
            type="number"
            id="itemPrice"
            placeholder="Enter price"
        >

        <button onclick="generateInvoice()">
            Generate Invoice
        </button>

        <div id="invoiceResult" class="result"></div>

    </div>


    <!-- PRICE LIST GENERATOR -->

    <div class="tool">

        <h2>🏷️ Price List Generator</h2>

        <label>Business Name</label>

        <input
            type="text"
            id="priceListBusiness"
            placeholder="Example: Idris Fashion Store"
        >

        <label>Product or Service</label>

        <input
            type="text"
            id="priceListItem"
            placeholder="Example: T-Shirt"
        >

        <label>Price</label>

        <input
            type="number"
            id="priceListPrice"
            placeholder="Example: 15000"
        >

        <button onclick="generatePriceList()">
            Generate Price List
        </button>

        <div id="priceListResult" class="result"></div>

    </div>


    <footer>

        <p>
            © 2026 Idris Business Tools
        </p>

    </footer>


    <script>


        // PROFIT CALCULATOR

        function calculateProfit() {

            let buyingPrice =
                Number(document.getElementById("buyingPrice").value);

            let sellingPrice =
                Number(document.getElementById("sellingPrice").value);

            let quantity =
                Number(document.getElementById("quantity").value);

            if (
                buyingPrice <= 0 ||
                sellingPrice <= 0 ||
                quantity <= 0
            ) {

                document.getElementById("profitResult").style.display = "block";

                document.getElementById("profitResult").innerHTML =
                    "<strong>Please enter valid numbers.</strong>";

                return;
            }

            let totalCost =
                buyingPrice * quantity;

            let totalSales =
                sellingPrice * quantity;

            let profit =
                totalSales - totalCost;

            let profitPercentage =
                (profit / totalCost) * 100;

            document.getElementById("profitResult").style.display = "block";

            document.getElementById("profitResult").innerHTML =

                "<strong>Total Cost:</strong> ₦" +
                totalCost.toLocaleString() +

                "<br><strong>Total Sales:</strong> ₦" +
                totalSales.toLocaleString() +

                "<br><strong>Profit:</strong> ₦" +
                profit.toLocaleString() +

                "<br><strong>Profit Percentage:</strong> " +
                profitPercentage.toFixed(2) + "%";
        }


        // DISCOUNT CALCULATOR

        function calculateDiscount() {

            let originalPrice =
                Number(document.getElementById("originalPrice").value);

            let discountPercent =
                Number(document.getElementById("discountPercent").value);

            if (
                originalPrice <= 0 ||
                discountPercent < 0 ||
                discountPercent > 100
            ) {

                document.getElementById("discountResult").style.display = "block";

                document.getElementById("discountResult").innerHTML =
                    "<strong>Please enter valid numbers.</strong>";

                return;
            }

            let discountAmount =
                originalPrice * (discountPercent / 100);

            let finalPrice =
                originalPrice - discountAmount;

            document.getElementById("discountResult").style.display = "block";

            document.getElementById("discountResult").innerHTML =

                "<strong>Discount Amount:</strong> ₦" +
                discountAmount.toLocaleString() +

                "<br><strong>Final Price:</strong> ₦" +
                finalPrice.toLocaleString();
        }


        // INVOICE GENERATOR

        function generateInvoice() {

            let businessName =
                document.getElementById("businessName").value.trim();

            let customerName =
                document.getElementById("customerName").value.trim();

            let itemName =
                document.getElementById("itemName").value.trim();

            let quantity =
                Number(document.getElementById("invoiceQuantity").value);

            let price =
                Number(document.getElementById("itemPrice").value);


            if (
                businessName === "" ||
                customerName === "" ||
                itemName === "" ||
                quantity <= 0 ||
                price <= 0
            ) {

                document.getElementById("invoiceResult").style.display = "block";

                document.getElementById("invoiceResult").innerHTML =
                    "<strong>Please complete all fields.</strong>";

                return;
            }


            let total =
                quantity * price;


            let invoiceNumber =
                "INV-" + Date.now().toString().slice(-6);


            let invoiceDate =
                new Date().toLocaleDateString();


            document.getElementById("invoiceResult").style.display = "block";


            document.getElementById("invoiceResult").innerHTML = `

                <div class="invoice">

                    <h3>INVOICE</h3>

                    <div class="invoice-info">

                        <div>
                            <strong>Invoice No:</strong><br>
                            ${invoiceNumber}
                        </div>

                        <div>
                            <strong>Date:</strong><br>
                            ${invoiceDate}
                        </div>

                    </div>

                    <p>
                        <strong>Business:</strong>
                        ${businessName}
                    </p>

                    <p>
                        <strong>Customer:</strong>
                        ${customerName}
                    </p>

                    <hr>

                    <p>
                        <strong>Item/Service:</strong>
                        ${itemName}
                    </p>

                    <p>
                        <strong>Quantity:</strong>
                        ${quantity}
                    </p>

                    <p>
                        <strong>Price:</strong>
                        ₦${price.toLocaleString()}
                    </p>

                    <hr>

                    <p class="total">
                        Total: ₦${total.toLocaleString()}
                    </p>

                </div>

                <button
                    class="print-button"
                    onclick="printInvoice()"
                >
                    🖨️ Print / Save as PDF
                </button>

            `;
        }


        // PRINT / SAVE INVOICE

        function printInvoice() {

            let invoice =
                document.querySelector(".invoice");

            if (!invoice) {

                alert("Please generate an invoice first.");

                return;
            }

            let printWindow =
                window.open("", "_blank");

            if (!printWindow) {

                alert("Please allow pop-ups for this website.");

                return;
            }

            printWindow.document.write(`

                <!DOCTYPE html>

                <html>

                <head>

                    <title>Invoice</title>

                    <style>

                        body {
                            font-family: Arial, sans-serif;
                            padding: 30px;
                            color: #222;
                        }

                        .invoice {
                            max-width: 600px;
                            margin: auto;
                            padding: 30px;
                            border: 1px solid #ddd;
                        }

                        .invoice h3 {
                            text-align: center;
                        }

                        .invoice-info {
                            display: flex;
                            justify-content: space-between;
                            margin-bottom: 20px;
                        }

                        .total {
                            font-size: 22px;
                            font-weight: bold;
                        }

                    </style>

                </head>

                <body>

                    ${invoice.outerHTML}

                </body>

                </html>

            `);

            printWindow.document.close();

            printWindow.focus();

            setTimeout(function() {

                printWindow.print();

            }, 500);

        }


        // PRICE LIST GENERATOR

        function generatePriceList() {

            let businessName =
                document.getElementById("priceListBusiness").value.trim();

            let itemName =
                document.getElementById("priceListItem").value.trim();

            let price =
                Number(document.getElementById("priceListPrice").value);


            if (
                businessName === "" ||
                itemName === "" ||
                price <= 0
            ) {

                document.getElementById("priceListResult").style.display = "block";

                document.getElementById("priceListResult").innerHTML =
                    "<strong>Please complete all fields.</strong>";

                return;
            }


            document.getElementById("priceListResult").style.display = "block";


            document.getElementById("priceListResult").innerHTML = `

                <div class="price-list">

                    <h3>${businessName}</h3>

                    <hr>

                    <div class="price-item">

                        <span>
                            ${itemName}
                        </span>

                        <span class="price">
                            ₦${price.toLocaleString()}
                        </span>

                    </div>

                </div>

                <button
                    class="print-button"
                    onclick="printPriceList()"
                >
                    🖨️ Print / Save as PDF
                </button>

            `;
        }


        // PRINT PRICE LIST

        function printPriceList() {

            let priceList =
                document.querySelector(".price-list");

            if (!priceList) {

                alert("Please generate a price list first.");

                return;
            }

            let printWindow =
                window.open("", "_blank");

            if (!printWindow) {

                alert("Please allow pop-ups for this website.");

                return;
            }

            printWindow.document.write(`

                <!DOCTYPE html>

                <html>

                <head>

                    <title>Price List</title>

                    <style>

                        body {
                            font-family: Arial, sans-serif;
                            padding: 30px;
                            color: #222;
                        }

                        .price-list {
                            max-width: 600px;
                            margin: auto;
                            padding: 30px;
                            border: 1px solid #ddd;
                        }

                        .price-list h3 {
                            text-align: center;
                        }

                        .price-item {
                            display: flex;
                            justify-content: space-between;
                            padding: 15px 0;
                            border-bottom: 1px solid #ddd;
                        }

                        .price {
                            font-weight: bold;
                        }

                    </style>

                </head>

                <body>

                    ${priceList.outerHTML}

                </body>

                </html>

            `);

            printWindow.document.close();

            printWindow.focus();

            setTimeout(function() {

                printWindow.print();

            }, 500);

        }

    </script>

</body>

</html>
