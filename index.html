<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Idris Business Tools</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f4f6f8;
            color: #222;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            margin-bottom: 8px;
        }

        header p {
            color: #666;
        }

        .tool {
            max-width: 500px;
            margin: 25px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
        }

        h2 {
            text-align: center;
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            background: #222;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        .result {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: #f1f1f1;
            border-radius: 10px;
            line-height: 1.8;
        }

        .main-result {
            font-size: 22px;
            font-weight: bold;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            color: #777;
        }
    </style>
</head>

<body>

    <header>

        <h1>Idris Business Tools</h1>

        <p>
            Simple tools to help small businesses calculate prices and profits.
        </p>

    </header>


    <!-- PROFIT CALCULATOR -->

    <div class="tool">

        <h2>🧮 Profit Calculator</h2>

        <label for="buyingPrice">Buying Price</label>

        <input
            type="number"
            id="buyingPrice"
            placeholder="Enter buying price"
        >

        <label for="sellingPrice">Selling Price</label>

        <input
            type="number"
            id="sellingPrice"
            placeholder="Enter selling price"
        >

        <label for="quantity">Quantity</label>

        <input
            type="number"
            id="quantity"
            placeholder="Enter quantity"
        >

        <button onclick="calculateProfit()">
            Calculate Profit
        </button>

        <div id="profitResult" class="result"></div>

    </div>


    <!-- DISCOUNT CALCULATOR -->

    <div class="tool">

        <h2>🏷️ Discount Calculator</h2>

        <label for="originalPrice">Original Price</label>

        <input
            type="number"
            id="originalPrice"
            placeholder="Enter original price"
        >

        <label for="discountPercent">Discount Percentage</label>

        <input
            type="number"
            id="discountPercent"
            placeholder="Example: 20"
        >

        <button onclick="calculateDiscount()">
            Calculate Discount
        </button>

        <div id="discountResult" class="result"></div>

    </div>


    <footer>

        <p>
            © 2026 Idris Business Tools
        </p>

    </footer>


    <script>

        // PROFIT CALCULATOR

        function calculateProfit() {

            let buyingPrice =
                Number(document.getElementById("buyingPrice").value);

            let sellingPrice =
                Number(document.getElementById("sellingPrice").value);

            let quantity =
                Number(document.getElementById("quantity").value);


            if (
                buyingPrice <= 0 ||
                sellingPrice <= 0 ||
                quantity <= 0
            ) {

                document.getElementById("profitResult").style.display = "block";

                document.getElementById("profitResult").innerHTML =
                    "<strong>Please enter valid numbers.</strong>";

                return;
            }


            let totalCost =
                buyingPrice * quantity;

            let totalSales =
                sellingPrice * quantity;

            let profit =
                totalSales - totalCost;

            let profitPercentage =
                (profit / totalCost) * 100;


            document.getElementById("profitResult").style.display = "block";

            document.getElementById("profitResult").innerHTML =

                "<strong>Total Cost:</strong> ₦" +
                totalCost.toLocaleString() +

                "<br><strong>Total Sales:</strong> ₦" +
                totalSales.toLocaleString() +

                "<br><strong>Profit:</strong> ₦" +
                profit.toLocaleString() +

                "<br><strong>Profit Percentage:</strong> " +
                profitPercentage.toFixed(2) +
                "%";

        }


        // DISCOUNT CALCULATOR

        function calculateDiscount() {

            let originalPrice =
                Number(document.getElementById("originalPrice").value);

            let discountPercent =
                Number(document.getElementById("discountPercent").value);


            if (
                originalPrice <= 0 ||
                discountPercent < 0 ||
                discountPercent > 100
            ) {

                document.getElementById("discountResult").style.display = "block";

                document.getElementById("discountResult").innerHTML =
                    "<strong>Please enter valid numbers.</strong>";

                return;
            }


            let discountAmount =
                originalPrice * (discountPercent / 100);

            let finalPrice =
                originalPrice - discountAmount;


            document.getElementById("discountResult").style.display = "block";

            document.getElementById("discountResult").innerHTML =

                "<strong>Discount Amount:</strong> ₦" +
                discountAmount.toLocaleString() +

                "<br><strong>Final Price:</strong> ₦" +
                finalPrice.toLocaleString();

        }

    </script>

</body>

</html>
